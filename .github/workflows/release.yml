name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build encode.exe
        run: sh build.sh --windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          sha256sum encode.exe > encode.exe.sha256
          cat encode.exe.sha256
          gh release create "$GITHUB_REF_NAME" encode.exe encode.exe.sha256 ../THIRD_PARTY.md ../LICENSE \
            --title "$GITHUB_REF_NAME" \
            --notes "encode.exe: Windows x64 build of the encoder (static, no extra DLLs). Put it at build/encode.exe. Third-party licenses in THIRD_PARTY.md."
